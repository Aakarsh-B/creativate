# Pages CMS config (https://pagescms.org) - edit blog posts at app.pagescms.org
media:
  - name: blog_images
    label: Blog images
    input: public/images/blog
    output: /images/blog
    categories: [image]
    rename: safe

content:
  - name: blog
    label: Blog posts
    type: collection
    path: src/content/our-blog
    format: json
    filename: "{fields.slug}.json"
    view:
      fields: [title.rendered, date]
      primary: title.rendered
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: false
        type: object
        fields:
          - name: rendered
            label: Title
            type: string
            required: true
      - name: slug
        label: URL slug
        description: Lowercase words joined by hyphens, e.g. my-new-post. The post lives at creativate.in/our-blog/<slug>.
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and hyphens only
      - name: date
        label: Publish date
        description: Newest posts show first on the blog page.
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss"
      - name: acf
        label: false
        type: object
        fields:
          - name: featured_image
            label: Thumbnail (blog list card)
            type: image
            required: true
            options:
              media: blog_images
          - name: banner_image
            label: Banner (top of the post)
            type: image
            required: true
            options:
              media: blog_images
          - name: other_blogs
            label: Related posts (shown at the bottom)
            type: reference
            options:
              collection: blog
              multiple: true
              max: 2
              value: "{fields.slug}"
              label: "{fields.title.rendered}"
              search: "fields.title.rendered"
          - name: metadata
            label: SEO
            type: object
            fields:
              - name: title
                label: SEO title
                type: string
              - name: description
                label: SEO description
                type: text
              - name: keywords
                label: Keywords
                type: string
          - name: current_blog_url
            type: string
            hidden: true
      - name: content
        label: false
        type: object
        fields:
          - name: rendered
            label: Post body
            type: rich-text
            required: true
            options:
              format: html
              media: blog_images
